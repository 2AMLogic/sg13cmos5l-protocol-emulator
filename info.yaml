# Tiny Tapeout project information
#
# Taken from the Tiny Tapeout `cmos5l` template
# (https://github.com/TinyTapeout/ttihp-verilog-template/tree/cmos5l) per
# CLAUDE.md's "Harness bootstrap" section and populated for this project
# (issue #2).
#
# 2026-09-30 (issue #18): `top_module` is no longer the harness-bootstrap
# stub. It is the ISA core datapath of
# `spec/decision-records/0001-isa.md` wired to its SRAM-macro-backed
# program memory (`spec/decision-records/0005-program-memory-implementation.md`),
# so `description`, `pinout` and `tiles` below all change with it. Note
# that DR 0001 and DR 0005 are both `Proposed`, not ratified -- the
# two-key mechanism has never run in this repository
# (`spec/decision-records/0006-two-key-ratification-never-ran.md`,
# issue #45) -- so what this file declares is the design as built and
# measured, against targets that are proposed rather than binding.
project:
  title:        "Protocol emulator ASIC (ISA core)"
  author:       "2AMLogic"
  discord:      ""
  description:  "A firmware-programmable protocol-emulator core: a 16-opcode, 4-register pin-timing ISA with a 256x16 SRAM program memory loaded serially over two pins. UART/SPI/I2C are firmware for this core, not hardware blocks -- there is deliberately no fixed-function protocol peripheral on the die."
  language:     "Verilog"
  # clock_hz is the target-spec row 4 number (>=50 MHz). It was declared here as
  # a DRAFT carried over from the README, UNCONFIRMED by STA on either flow.
  #
  # 2026-10-02 (issue #20): it now has measured backing from ONE flow, and the
  # value is UNCHANGED at 50 MHz -- this is a reconciliation, not a re-tune.
  # Reconciled the same way `tiles` was (see the 2026-09-30 note below it):
  # cite the flow-attributed evidence, and KEEP the draft/unratified qualifier
  # rather than dropping it.
  #
  #   MEASURED (LibreLane flow only): the competition's own flow hardens this
  #   design end to end at CLOCK_PERIOD 20 (src/config.json) -- 20 ns, i.e.
  #   exactly the 50 MHz declared here -- and OpenSTA reports POST-ROUTE worst
  #   setup slack +9.6214 ns at nom_slow_1p08V_125C (the binding setup corner),
  #   +13.5576 ns at nom_typ_1p20V_25C, +14.6486 ns at nom_fast_1p32V_m40C, and
  #   worst hold slack +0.1156 ns at nom_fast_1p32V_m40C (the binding hold
  #   corner), with ZERO setup and ZERO hold violations at every corner.
  #   LibreLane 3.1.0.dev3 via tt-gds-action, CI run 36837745318 @ 21a2a63.
  #   Record: verification/records/librelane-corner-timing/records/20261002-095445-21a2a63.md
  #
  # Read that as what it is, and note the three things it is NOT:
  #
  #   (a) It is the LIBRELANE flow's number, per CLAUDE.md's two-flows rule.
  #       The klt/OpenROAD flow reports NOTHING for this design: `klt sta` has
  #       no way to declare the SRAM macro's LEF/liberty, so it produced 0 of 6
  #       corners (record verification/records/sta-corner-sweep/records/
  #       20260930-195410-ead870a.md; upstream 2AMLogic/klayout-tools#2635,
  #       open). One flow's answer plus one flow's silence -- not agreement,
  #       and not a disagreement either.
  #   (b) It is PARTIAL coverage of row 4: 3 corners, not the 6 that row
  #       declares. The macro ships exactly three liberty characterizations,
  #       none above 1.32 V, so the 1.35/1.50/1.65 V corners are unreachable by
  #       construction for this design -- no flow can produce them. Whether
  #       row 4's bar should be re-declared accordingly is a spec question
  #       filed as issue #69, NOT settled here.
  #   (c) It is NOT an f_max claim. 50 MHz is what the run constrains and what
  #       this field declares; the residual-period arithmetic (~96 MHz) is an
  #       extrapolation from a clock tree built for 20 ns, not a measurement.
  #
  # So: still DRAFT and UNRATIFIED -- target-spec row 4 reads "PROPOSED -- not
  # ratified" (DR 0006 / issues #44, #45), exactly as `tiles` below is still
  # bound to DR 0005's unratified status. What changed on 2026-10-02 is that
  # the number is no longer unmeasured; its authority as sign-off is unchanged.
  # Full detail: spec/gap-to-submission.md row 4.
  clock_hz:     50000000 # 50 MHz -- DRAFT, unratified; measured on the LibreLane flow only, 3 of 6 declared corners (see the note above and spec/gap-to-submission.md row 4)

  # How many tiles your design occupies?
  #
  # NOTE (2026-09-25, issue #39): the template's own comment here used to read
  # "A single tile is about 167x108 uM". That is an order-of-magnitude figure
  # and is NOT what the flow of record uses. tt-support-tools sets LibreLane's
  # DIE_AREA from tech/ihp-sg13cmos5l/tile_sizes.yaml: 1x1 = 202.08 x 154.98 um,
  # 2x2 = 419.52 x 313.74 um, 8x4 = 1724.16 x 710.64 um. See
  # verification/records/program-memory-macro-feasibility/records/20260925-000359-63b10d7.md.
  #
  # 2026-09-30 (issue #18): grown from "1x1" to "2x2" -- the ratified row-7
  # budget, not past it. Two reasons, one geometric and one measured:
  #
  #   (a) GEOMETRIC, and not negotiable: the program memory is now the
  #       RM_IHPSG13_1P_256x16_c2_bm_bist macro (DR 0005), whose LEF SIZE is
  #       236.8 x 118.78 um. A 1x1 die is 202.08 x 154.98 um -- the macro is
  #       wider than the whole die in either orientation, so 1x1 cannot hold
  #       this design at any utilization. 2x2 is the smallest legal tile
  #       allocation that can.
  #   (b) MEASURED: the klt/Yosys flow synthesizes the whole top to 568
  #       instances, of which 567 are standard cells totalling 10,323.2556 um^2
  #       (the macro is a blackbox there and contributes 0 -- see
  #       flow/blackbox-RM_IHPSG13_1P_256x16_c2_bm_bist.v). Cells plus the
  #       macro's 28,127.104 um^2 is 38,450.4 um^2 against the 2x2 core area of
  #       126,685 um^2 = 30.4% core density, comfortably inside the
  #       PL_TARGET_DENSITY_PCT 60 this repo's src/config.json asks for.
  #
  # Read (b) as what it is: a CELL-AREA figure from the klt flow, not a placed
  # die area, and not the LibreLane flow's number. Per CLAUDE.md's two-flows
  # rule the LibreLane figure is the `gds` workflow's own, reported separately.
  # `verification/records/synthesis-baseline/` carries the klt cell-area half
  # and `verification/records/die-area-baseline/` records why the klt flow
  # could not place it at all (klayout-tools#2635); both say which flow
  # produced which number. `verification/records/core-datapath/` is the
  # functional/cycle-level leg and deliberately claims no area at all.
  tiles: "2x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_2amlogic_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  #
  # protocol_core.v and protocol_program_memory.v are symlinks in src/ to the
  # single copies under rtl/ (see rtl/README.md): the template fixes source
  # files at ./src, and this repo keeps exactly one copy of each module, so the
  # two flows can never disagree about WHAT they built.
  #
  # protocol_boot_rom.v (issue #138, DR 0013 layer 2) is a symlink to
  # rtl/protocol_boot_rom.v too. That file is GENERATED from the committed boot
  # image firmware/build/boot/boot_rom.hex by firmware/tools/gen_boot_rom.py;
  # firmware/tools/check_firmware.py fails if it is stale.
  #
  # The SRAM macro's behavioural model (rtl/vendor/) is deliberately NOT listed:
  # the macro is a hard block, blackboxed against its LEF/liberty by
  # src/config.json's MACROS entry. Listing it here would make LibreLane
  # synthesize a 4,096-flip-flop array -- the implementation DR 0005 replaced.
  source_files:
    - "tt_um_2amlogic_protocol_emulator.v"
    - "protocol_core.v"
    - "protocol_program_memory.v"
    - "protocol_boot_rom.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
#
# 2026-09-21 (issue #19): ui[0] and ui[7] name the program-load protocol
# roles DR 0001 section "Program memory sizing and loading" assigns
# (ui_in[7] = MODE, ui_in[0] = serial data).
#
# 2026-09-30 (issue #18): the remaining pins get their real ISA roles. They
# are deliberately GENERIC, because that is the design: DR 0001 exposes four
# addressable 8-bit ports (ui_in, uio_in read-only; uo_out, uio_out
# write-only) and what any individual pin *means* -- TX, SCLK, SDA -- is
# decided by the firmware image loaded at run time, not by the silicon. A
# per-protocol pin plan belongs to the firmware issues (#23) and to a pin-role
# decision record, not here. uio_oe is fixed at 0 (all bidirectional pins are
# inputs) until such a record admits a bidirectional protocol; DR 0001's
# "Consequences" flags that as a known limitation for I2C's open-drain SDA.
#
# 2026-10-09 (issue #135, DR 0012): uio direction is now set by firmware at
# run time. Two control registers, written with WCTL (OUT to port 00, index
# in imm8), choose each bidirectional pin's mode: UIO_OD[n] = open-drain
# (drives low on uio_out[n] = 0, releases on 1), else UIO_DIR[n] = push-pull,
# else input. Both reset to 0, so every uio pin is an input after reset.
#
# 2026-10-09 (issue #138, DR 0013 layer 2): PROG_MODE low at reset release no
# longer runs program memory. It runs an on-chip boot ROM, whose program reads
# ui[6:5] as straps with an ordinary IN (00 UART load and 01 SPI-flash boot
# are stubs that idle; 10 warm-starts a CRC-checked image; 11 behaves as 00).
# The strap reading is firmware, not hardware: ui[5] and ui[6] are still plain
# ISA input bits to any loaded program.
pinout:
  # Inputs
  ui[0]: "PROG_SER: serial program-load data bit (load phase); ISA input port 00 bit 0 in run phase"
  ui[1]: "ISA input port 00 bit 1 (read by IN Rd, 00)"
  ui[2]: "ISA input port 00 bit 2 (read by IN Rd, 00)"
  ui[3]: "ISA input port 00 bit 3 (read by IN Rd, 00)"
  ui[4]: "ISA input port 00 bit 4 (read by IN Rd, 00)"
  ui[5]: "ISA input port 00 bit 5 (read by IN Rd, 00); the boot ROM's program reads it as strap bit 0 when ui[7] is low at reset"
  ui[6]: "ISA input port 00 bit 6 (read by IN Rd, 00); the boot ROM's program reads it as strap bit 1 when ui[7] is low at reset"
  ui[7]: "PROG_MODE: high at reset release = serial program load phase, low = run the on-chip boot ROM; ISA input port 00 bit 7 in run phase"

  # Outputs
  uo[0]: "ISA output port 10 bit 0 (driven by OUT 10, Rs; registered, one cycle after the OUT)"
  uo[1]: "ISA output port 10 bit 1 (driven by OUT 10, Rs)"
  uo[2]: "ISA output port 10 bit 2 (driven by OUT 10, Rs)"
  uo[3]: "ISA output port 10 bit 3 (driven by OUT 10, Rs)"
  uo[4]: "ISA output port 10 bit 4 (driven by OUT 10, Rs)"
  uo[5]: "ISA output port 10 bit 5 (driven by OUT 10, Rs)"
  uo[6]: "ISA output port 10 bit 6 (driven by OUT 10, Rs)"
  uo[7]: "ISA output port 10 bit 7 (driven by OUT 10, Rs)"

  # Bidirectional pins
  # Inputs after reset (uio_oe = 0). IN Rd, 01 always reads them. OUT 11, Rs
  # writes the uio_out register, which reaches the pad only on pins that
  # firmware has enabled through UIO_DIR (push-pull) or UIO_OD (open-drain).
  # The shipped SPI and I2C profiles use the upper Pmod row (DR 0010's target
  # plan, issue #155); one firmware image, so one protocol, per run.
  uio[0]: "ISA input port 01 bit 0 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD); shipped SPI firmware: CS (Tiny Tapeout SPI Pmod)"
  uio[1]: "ISA input port 01 bit 1 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD); shipped SPI firmware: MOSI (SPI Pmod)"
  uio[2]: "ISA input port 01 bit 2 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD); shipped SPI firmware: MISO (SPI Pmod); shipped I2C firmware: SCL (Tiny Tapeout I2C Pmod)"
  uio[3]: "ISA input port 01 bit 3 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD); shipped SPI firmware: SCLK, the Pmod's SCK (SPI Pmod); shipped I2C firmware: SDA (I2C Pmod)"
  uio[4]: "ISA input port 01 bit 4 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD)"
  uio[5]: "ISA input port 01 bit 5 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD)"
  uio[6]: "ISA input port 01 bit 6 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD)"
  uio[7]: "ISA input port 01 bit 7 (read by IN Rd, 01); input at reset, firmware-configured output (OUT 11, Rs via UIO_DIR / UIO_OD)"

# Do not change!
yaml_version: 6
