# Tiny Tapeout project information
#
# Taken from the Tiny Tapeout `cmos5l` template
# (https://github.com/TinyTapeout/ttihp-verilog-template/tree/cmos5l) per
# CLAUDE.md's "Harness bootstrap" section and populated for this project
# (issue #2). `top_module` is a stub that only wires up the fixed pin budget
# (clk/rst_n/ena + 8 in / 8 out / 8 bidir) -- the ISA has not been ratified
# yet (spec/, issue #1), so `tiles`, `pinout`, and `clock_hz` below are
# placeholders sized for the stub, not a ratified area/pinout budget. Revisit
# once issue #1 lands.
project:
  title:        "Protocol emulator ASIC (harness bootstrap stub)"
  author:       "2AMLogic"
  discord:      ""
  description:  "Harness-bootstrap stub for a firmware-programmable protocol-emulator core; the ISA is not designed yet (see spec/, issue #1) -- this top only proves clk/rst_n/ena and the pin budget."
  language:     "Verilog"
  clock_hz:     50000000 # 50 MHz -- the draft board-clock target in README.md's target spec table (DRAFT, unratified)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # stub only; the ratified ISA's area budget is a later decision record

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_2amlogic_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_2amlogic_protocol_emulator.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
#
# Left blank: no ISA is ratified yet, so no pin has a fixed protocol role.
# The stub top registers ui_in onto uo_out and leaves uio_* as inputs
# (uio_oe = 0); see src/tt_um_2amlogic_protocol_emulator.v.
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
