# Tiny Tapeout project information
#
# Taken from the Tiny Tapeout `cmos5l` template
# (https://github.com/TinyTapeout/ttihp-verilog-template/tree/cmos5l) per
# CLAUDE.md's "Harness bootstrap" section and populated for this project
# (issue #2).
#
# 2026-09-30 (issue #18): `top_module` is no longer the harness-bootstrap
# stub. It is the ISA core datapath of
# `spec/decision-records/0001-isa.md` wired to its SRAM-macro-backed
# program memory (`spec/decision-records/0005-program-memory-implementation.md`),
# so `description`, `pinout` and `tiles` below all change with it. Note
# that DR 0001 and DR 0005 are both `Proposed`, not ratified -- the
# two-key mechanism has never run in this repository
# (`spec/decision-records/0006-two-key-ratification-never-ran.md`,
# issue #45) -- so what this file declares is the design as built and
# measured, against targets that are proposed rather than binding.
project:
  title:        "Protocol emulator ASIC (ISA core)"
  author:       "2AMLogic"
  discord:      ""
  description:  "A firmware-programmable protocol-emulator core: a 16-opcode, 4-register pin-timing ISA with a 256x16 SRAM program memory loaded serially over two pins. UART/SPI/I2C are firmware for this core, not hardware blocks -- there is deliberately no fixed-function protocol peripheral on the die."
  language:     "Verilog"
  clock_hz:     50000000 # 50 MHz -- the target-spec row 4 number, still UNCONFIRMED by STA on either flow (see spec/gap-to-submission.md row 4)

  # How many tiles your design occupies?
  #
  # NOTE (2026-09-25, issue #39): the template's own comment here used to read
  # "A single tile is about 167x108 uM". That is an order-of-magnitude figure
  # and is NOT what the flow of record uses. tt-support-tools sets LibreLane's
  # DIE_AREA from tech/ihp-sg13cmos5l/tile_sizes.yaml: 1x1 = 202.08 x 154.98 um,
  # 2x2 = 419.52 x 313.74 um, 8x4 = 1724.16 x 710.64 um. See
  # verification/records/program-memory-macro-feasibility/records/20260925-000359-63b10d7.md.
  #
  # 2026-09-30 (issue #18): grown from "1x1" to "2x2" -- the ratified row-7
  # budget, not past it. Two reasons, one geometric and one measured:
  #
  #   (a) GEOMETRIC, and not negotiable: the program memory is now the
  #       RM_IHPSG13_1P_256x16_c2_bm_bist macro (DR 0005), whose LEF SIZE is
  #       236.8 x 118.78 um. A 1x1 die is 202.08 x 154.98 um -- the macro is
  #       wider than the whole die in either orientation, so 1x1 cannot hold
  #       this design at any utilization. 2x2 is the smallest legal tile
  #       allocation that can.
  #   (b) MEASURED: the klt/Yosys flow synthesizes the whole top to 568
  #       instances, of which 567 are standard cells totalling 10,323.2556 um^2
  #       (the macro is a blackbox there and contributes 0 -- see
  #       flow/blackbox-RM_IHPSG13_1P_256x16_c2_bm_bist.v). Cells plus the
  #       macro's 28,127.104 um^2 is 38,450.4 um^2 against the 2x2 core area of
  #       126,685 um^2 = 30.4% core density, comfortably inside the
  #       PL_TARGET_DENSITY_PCT 60 this repo's src/config.json asks for.
  #
  # Read (b) as what it is: a CELL-AREA figure from the klt flow, not a placed
  # die area, and not the LibreLane flow's number. Per CLAUDE.md's two-flows
  # rule the LibreLane figure is the `gds` workflow's own, reported separately.
  # `verification/records/synthesis-baseline/` carries the klt cell-area half
  # and `verification/records/die-area-baseline/` records why the klt flow
  # could not place it at all (klayout-tools#2635); both say which flow
  # produced which number. `verification/records/core-datapath/` is the
  # functional/cycle-level leg and deliberately claims no area at all.
  tiles: "2x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_2amlogic_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  #
  # protocol_core.v and protocol_program_memory.v are symlinks in src/ to the
  # single copies under rtl/ (see rtl/README.md): the template fixes source
  # files at ./src, and this repo keeps exactly one copy of each module, so the
  # two flows can never disagree about WHAT they built.
  #
  # The SRAM macro's behavioural model (rtl/vendor/) is deliberately NOT listed:
  # the macro is a hard block, blackboxed against its LEF/liberty by
  # src/config.json's MACROS entry. Listing it here would make LibreLane
  # synthesize a 4,096-flip-flop array -- the implementation DR 0005 replaced.
  source_files:
    - "tt_um_2amlogic_protocol_emulator.v"
    - "protocol_core.v"
    - "protocol_program_memory.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
#
# 2026-09-21 (issue #19): ui[0] and ui[7] name the program-load protocol
# roles DR 0001 section "Program memory sizing and loading" assigns
# (ui_in[7] = MODE, ui_in[0] = serial data).
#
# 2026-09-30 (issue #18): the remaining pins get their real ISA roles. They
# are deliberately GENERIC, because that is the design: DR 0001 exposes four
# addressable 8-bit ports (ui_in, uio_in read-only; uo_out, uio_out
# write-only) and what any individual pin *means* -- TX, SCLK, SDA -- is
# decided by the firmware image loaded at run time, not by the silicon. A
# per-protocol pin plan belongs to the firmware issues (#23) and to a pin-role
# decision record, not here. uio_oe is fixed at 0 (all bidirectional pins are
# inputs) until such a record admits a bidirectional protocol; DR 0001's
# "Consequences" flags that as a known limitation for I2C's open-drain SDA.
pinout:
  # Inputs
  ui[0]: "PROG_SER: serial program-load data bit (load phase); ISA input port 00 bit 0 in run phase"
  ui[1]: "ISA input port 00 bit 1 (read by IN Rd, 00)"
  ui[2]: "ISA input port 00 bit 2 (read by IN Rd, 00)"
  ui[3]: "ISA input port 00 bit 3 (read by IN Rd, 00)"
  ui[4]: "ISA input port 00 bit 4 (read by IN Rd, 00)"
  ui[5]: "ISA input port 00 bit 5 (read by IN Rd, 00)"
  ui[6]: "ISA input port 00 bit 6 (read by IN Rd, 00)"
  ui[7]: "PROG_MODE: high at reset release = serial program load phase; ISA input port 00 bit 7 in run phase"

  # Outputs
  uo[0]: "ISA output port 10 bit 0 (driven by OUT 10, Rs; registered, one cycle after the OUT)"
  uo[1]: "ISA output port 10 bit 1 (driven by OUT 10, Rs)"
  uo[2]: "ISA output port 10 bit 2 (driven by OUT 10, Rs)"
  uo[3]: "ISA output port 10 bit 3 (driven by OUT 10, Rs)"
  uo[4]: "ISA output port 10 bit 4 (driven by OUT 10, Rs)"
  uo[5]: "ISA output port 10 bit 5 (driven by OUT 10, Rs)"
  uo[6]: "ISA output port 10 bit 6 (driven by OUT 10, Rs)"
  uo[7]: "ISA output port 10 bit 7 (driven by OUT 10, Rs)"

  # Bidirectional pins
  # Held as inputs (uio_oe = 0) in this ISA revision: IN Rd, 01 reads them;
  # OUT 11, Rs writes the uio_out register but the direction is not
  # runtime-programmable, so nothing reaches the pad yet.
  uio[0]: "ISA input port 01 bit 0 (read by IN Rd, 01); held as an input"
  uio[1]: "ISA input port 01 bit 1 (read by IN Rd, 01); held as an input"
  uio[2]: "ISA input port 01 bit 2 (read by IN Rd, 01); held as an input"
  uio[3]: "ISA input port 01 bit 3 (read by IN Rd, 01); held as an input"
  uio[4]: "ISA input port 01 bit 4 (read by IN Rd, 01); held as an input"
  uio[5]: "ISA input port 01 bit 5 (read by IN Rd, 01); held as an input"
  uio[6]: "ISA input port 01 bit 6 (read by IN Rd, 01); held as an input"
  uio[7]: "ISA input port 01 bit 7 (read by IN Rd, 01); held as an input"

# Do not change!
yaml_version: 6
