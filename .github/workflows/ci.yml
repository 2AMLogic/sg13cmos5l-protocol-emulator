# CI for this program's own evidence-record convention (verification/README.md).
#
# Scope is deliberate, mirroring 2AMLogic/sky130-modexp's own ci.yml: this
# workflow runs the **tool-light** leg only -- the append-only evidence-record
# linter, which needs nothing but Python 3 and git (no PDK, no simulator).
#
# The Tiny Tapeout template's own cocotb harness (`test/`) is covered by
# `.github/workflows/test.yaml`/`gds.yaml`, taken verbatim from the template
# -- not duplicated here. The PDK-heavy legs (`klt synthesize`, this
# program's own `klt functional-verification` run) are NOT run here either:
# they need cocotb wired into `klt`'s own environment (see
# verification/README.md's "local-environment note") and, for synthesis, the
# PDK's standard-cell liberty. Those are run locally and committed as
# append-only records under `verification/records/`.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  records:
    name: evidence records (lint + append-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the append-only check diffs against the merge-base
          # with origin/main, which a shallow clone cannot resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure origin/main is available for the append-only base ref
        run: git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main

      - name: Syntax-check the verification scripts
        run: |
          python3 -m compileall -q verification firmware flow
          # The ISA reference simulator, its lockstep bench, generator, mutant
          # runner and unit tests (issue #152), named so a rename cannot drop them.
          python3 -m py_compile verification/reference_models/isa.py \
            verification/isa_lockstep_gen.py verification/test_isa_model.py \
            verification/test_isa_lockstep.py verification/isa_lockstep_mutants.py

      # Firmware toolchain (issue #22, DR 0003): the assembler's unit
      # tests (whole instruction set + malformed input) and a freshness
      # check that the committed firmware/build/ artifacts still match the
      # committed .asm source. Stdlib-only Python, same tool-light contract
      # as the records job. check_firmware.py discovers firmware/asm/*.asm
      # (no hand list) and runs gen_i2c_sr.py --check first. It also covers
      # the boot ROM chain (issue #138, DR 0013 layer 2): firmware/asm/boot/
      # -> firmware/build/boot/boot_rom.hex -> rtl/protocol_boot_rom.v, each
      # link checked; test_gen_boot_rom.py tests the generator itself.
      - name: Firmware assembler tests + build-artifact freshness
        run: |
          python3 firmware/tools/test_asm.py
          python3 firmware/tools/test_gen_boot_rom.py
          python3 firmware/tools/test_loadseq.py
          python3 firmware/tools/check_firmware.py

      # Datasheet drift (issue #110): docs/info.md's image table must agree
      # with firmware/asm/, firmware/build/ and the cycle reports.
      - name: Datasheet image table vs firmware tree
        run: |
          python3 scripts/test_check_datasheet.py
          python3 scripts/check_datasheet.py

      - name: Record linter + its self-test (npm run lint)
        run: npm run lint

      - name: Record linter, strict append-only against origin/main
        run: python3 verification/check_records.py --require-append-only --base-ref origin/main

  # klt signoff --manifest re-run (issue #16): CI re-renders this block's
  # T1 tier-verdict report from the committed block manifest against the
  # pinned klt and verifies the latest committed evidence record under
  # verification/records/signoff-baseline/ still reproduces, via
  # `klt signoff --check` (klayout-tools #2258) -- the grader's own
  # comparison, which excludes the report's build block so the same pinned
  # commit verifies from any provisioning route (klayout-tools #2249; the
  # byte-compare this replaces went red on exactly that route difference).
  # A manifest citing an artifact that has since changed therefore FAILS
  # here rather than rotting. Exit-code note: `klt signoff` exits 3 when at
  # least one T1 item is unmet -- the normal gap state -- which
  # scripts/signoff-report.sh maps to success in render mode; under
  # `--check`, 3 instead means "drifted" and is mapped to failure. Only a
  # real error or a drift-from-record fails this job. PDK/simulator
  # are not needed; setup-env.sh's provisioning (klt at the
  # layout/toolchain.json pin + cocotb) is reused verbatim so CI and local
  # developers grade with the same build.
  signoff:
    name: klt signoff manifest re-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Provision klt at the layout/toolchain.json pin
        run: ./scripts/setup-env.sh

      - name: Re-render the tier report and compare with the committed record
        run: scripts/signoff-report.sh --check-latest

  # RTL-level cocotb benches (issue #117): the PDK-free benches under
  # verification/ (everything driven by a verification/request-*.json;
  # test_check_records.py is covered by `npm run lint` in the records job,
  # test_firmware_templates.py by the same). Simulates rtl/ + the vendored
  # SRAM behavioural model under Icarus only. A pass/fail gate: it writes
  # nothing under verification/records/ -- evidence records remain
  # deliberate local runs. Benches need `klt functional-verification` (the
  # requests carry the sources, defines and recorded seeds), so klt +
  # cocotb are provisioned with the same setup-env.sh as the signoff job.
  # The formal gate is NOT part of the per-PR run: see the `formal` job
  # below (manual workflow_dispatch only, issue #122).
  rtl-benches:
    name: RTL cocotb benches (no PDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: astral-sh/setup-uv@v5

      - name: Provision klt + pinned cocotb
        run: ./scripts/setup-env.sh

      - name: Run the RTL benches (gate only, no records written)
        run: scripts/run-rtl-benches.sh

  # Formal gate (issue #122): the Yosys+SMTBMC/ABC harnesses under
  # verification/formal/ (no klt, no PDK, no simulator). The toolchain is a
  # pinned OSS CAD Suite release (yosys, yosys-abc, yosys-smtbmc, z3) fetched
  # as a tarball verified against a sha256 (the digest GitHub reports for the
  # release asset). Versions are printed in the log. Pass/fail gate only:
  # artifacts go to $RUNNER_TEMP, nothing is written under
  # verification/records/ (evidence records stay deliberate local runs, and a
  # green run is not one). Scripts run with their default timeouts.
  #
  # Manual (workflow_dispatch) only, by measurement (issue #122): two
  # consecutive hosted-runner runs were green with identical PASS verdicts but
  # took ~18 min and ~14 min of job time (the no-data-dependent-latency
  # real-core BMC dominates and varies 9.4-13.1 min), over the ~10 min
  # per-PR bar. See verification/README.md "What CI runs vs. what stays
  # local" for the numbers. Dispatch it to re-measure or to re-check a
  # toolchain bump.
  formal:
    name: formal gate (yosys/ABC/z3)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OSS_CAD_DATE: '20261009'
      OSS_CAD_SHA256: 20b7bd2d24e187aa87bbb3a0b70369a6aa352dac2048033eb2e68439a477ca0d
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned OSS CAD Suite (checksum verified)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/oss-cad"
          mkdir -p "$d"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_DATE:0:4}-${OSS_CAD_DATE:4:2}-${OSS_CAD_DATE:6:2}/oss-cad-suite-linux-x64-${OSS_CAD_DATE}.tgz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oss-cad.tgz" "$url"
          echo "${OSS_CAD_SHA256}  $RUNNER_TEMP/oss-cad.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oss-cad.tgz" -C "$d" --strip-components=1
          echo "$d/bin" >> "$GITHUB_PATH"
          echo "$d/lib" >> "$GITHUB_PATH"

      - name: Print tool versions
        run: |
          yosys -V
          yosys-abc -q 'version' || true
          yosys-smtbmc --help | head -1 || true
          z3 --version

      - name: no-data-dependent-latency (property + controls)
        run: |
          start=$SECONDS
          verification/formal/run-no-data-dependent-latency.sh "$RUNNER_TEMP/formal-ndl"
          echo "wall: $((SECONDS-start)) s"

      - name: mutant-gate regression
        run: |
          start=$SECONDS
          verification/formal/test-mutant-gate.sh
          echo "wall: $((SECONDS-start)) s"

      - name: pin-write-latency (ABC proofs, covers, mutants)
        run: |
          start=$SECONDS
          verification/formal/run-pin-write-latency.sh "$RUNNER_TEMP/formal-pwl"
          echo "wall: $((SECONDS-start)) s"

      - name: Nothing written under verification/records
        run: test -z "$(git status --porcelain -- verification/records)"
